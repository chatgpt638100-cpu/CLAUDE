name: Build Invitation Editor APK

# Builds the Flutter app on GitHub's runners, which have the network access
# needed to fetch the Flutter SDK and pub packages. Produces a downloadable
# APK and, when the build fails, the exact analyzer and compiler output.
#
# Run it manually from the Actions tab, or let it run on pushes touching the
# app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'invitation_editor/**'
      - '.github/workflows/build-invitation-editor.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invitation_editor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # Reported but not fatal: lint findings should not hide a working build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # The real gate. Its log is what identifies any remaining compile error.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-editor-debug-apk
          path: invitation_editor/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
